<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="40%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Steel Gradients for 3D Effect (Light source Top-Left) -->
    <!-- Blade Surface Top -->
    <linearGradient id="metalSurfaceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#d4d4d8"/>
      <stop offset="50%" stop-color="#71717a"/>
      <stop offset="80%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <!-- Blade Surface Bottom -->
    <linearGradient id="metalSurfaceBottom" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="40%" stop-color="#3f3f46"/>
      <stop offset="70%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>

    <!-- Blade Bevel (Cutting Edge Highlight) -->
    <linearGradient id="bevelHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#f4f4f5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Tubular Handle Gradient -->
    <linearGradient id="tubeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="25%" stop-color="#52525b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="75%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <linearGradient id="tubeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="25%" stop-color="#52525b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="75%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <!-- 3D Gold Dial -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c3"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#8a6d1c"/>
      <stop offset="100%" stop-color="#3d2f07"/>
    </linearGradient>
    
    <linearGradient id="goldBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2f07"/>
      <stop offset="30%" stop-color="#8a6d1c"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#fff5c3"/>
    </linearGradient>

    <!-- 3D Ruby -->
    <radialGradient id="ruby3D" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff8a8a"/>
      <stop offset="30%" stop-color="#e53935"/>
      <stop offset="70%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </radialGradient>

    <!-- Filters for Depth -->
    <!-- Heavy Drop Shadow for overall separation -->
    <filter id="dropShadowBase" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="15" dy="25" stdDeviation="15" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Crisp Drop Shadow for top piece overlapping bottom piece -->
    <filter id="dropShadowTop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="12" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Inner Bevel/Shadow for Handles -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="0"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.7" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#spotlight)"/>

  <!-- Subtle grid/accents -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500"/>
    <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600"/>
    <circle cx="400" cy="300" r="220" fill="none" stroke-dasharray="10 10"/>
  </g>

  <!-- Center Glow -->
  <circle cx="400" cy="300" r="180" fill="#d32f2f" opacity="0.15" filter="blur(40px)"/>

  <!-- ==================== PIECE 1: BOTTOM (Left Blade to Right Handle) ==================== -->
  <g filter="url(#dropShadowBase)">
    <!-- Main Body Shape -->
    <!-- We build it using distinct 3D parts -->
    
    <!-- Left Blade Thickness (Bottom Edge Shadow/Depth) -->
    <path fill="#18181b" d="
      M 398,303
      L 302,122
      Q 342,212 388,293
      Z
    "/>
    
    <!-- Left Blade Surface -->
    <path fill="url(#metalSurfaceBottom)" d="
      M 395,300
      L 300,120
      Q 340,210 385,290
      Z
    "/>

    <!-- Left Blade Bevel (Cutting Edge) -->
    <path fill="url(#bevelHighlight)" d="
      M 395,300
      L 300,120
      Q 325,210 370,290
      Z
    " opacity="0.8"/>

    <!-- Shank connecting to Right Handle -->
    <!-- Base Depth -->
    <path fill="#18181b" d="M 398,303 C 418,338 440,373 458,403 L 443,413 C 425,383 400,345 385,315 Z"/>
    <!-- Top Surface -->
    <path fill="url(#metalSurfaceBottom)" d="M 395,300 C 415,335 437,370 455,400 L 440,410 C 422,380 397,342 382,312 Z"/>
    <!-- Shank Highlight -->
    <path d="M 395,300 C 415,335 437,370 455,400" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

    <!-- Right Finger Loop (3D Torus Effect) -->
    <g transform="translate(470, 420)">
      <!-- Outer Shadow / Depth -->
      <circle cx="3" cy="5" r="33" fill="#000000" opacity="0.6"/>
      <!-- Main Ring -->
      <circle cx="0" cy="0" r="33" fill="none" stroke="url(#tubeGrad1)" stroke-width="14" filter="url(#innerShadow)"/>
      <!-- Ring Highlight -->
      <circle cx="-2" cy="-2" r="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- Finger Rest (Tang) -->
    <path d="M 500,430 C 520,445 540,455 550,460" fill="none" stroke="url(#tubeGrad1)" stroke-width="8" stroke-linecap="round" filter="url(#innerShadow)"/>
    <path d="M 500,428 C 520,443 540,453 550,458" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>


  <!-- ==================== PIECE 2: TOP (Right Blade to Left Handle) ==================== -->
  <g filter="url(#dropShadowTop)">
    <!-- Right Blade Thickness (Bottom Edge Shadow/Depth) -->
    <path fill="#18181b" d="
      M 402,303
      L 498,122
      Q 458,212 412,293
      Z
    "/>
    
    <!-- Right Blade Surface -->
    <path fill="url(#metalSurfaceTop)" d="
      M 405,300
      L 500,120
      Q 460,210 415,290
      Z
    "/>

    <!-- Right Blade Bevel (Cutting Edge) -->
    <path fill="url(#bevelHighlight)" d="
      M 405,300
      L 500,120
      Q 475,210 430,290
      Z
    " opacity="0.9"/>

    <!-- Shank connecting to Left Handle -->
    <!-- Base Depth -->
    <path fill="#18181b" d="M 403,303 C 383,338 360,373 342,403 L 357,413 C 375,383 400,345 415,315 Z"/>
    <!-- Top Surface -->
    <path fill="url(#metalSurfaceTop)" d="M 400,300 C 380,335 357,370 339,400 L 354,410 C 372,380 397,342 412,312 Z"/>
    <!-- Shank Highlight -->
    <path d="M 400,300 C 380,335 357,370 339,400" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

    <!-- Left Thumb Loop (3D Torus Effect) -->
    <g transform="translate(330, 420)">
      <!-- Outer Shadow / Depth -->
      <circle cx="3" cy="5" r="33" fill="#000000" opacity="0.6"/>
      <!-- Main Ring -->
      <circle cx="0" cy="0" r="33" fill="none" stroke="url(#tubeGrad2)" stroke-width="14" filter="url(#innerShadow)"/>
      <!-- Ring Highlight -->
      <circle cx="-2" cy="-2" r="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Rubber Bumper -->
    <circle cx="370" cy="415" r="6" fill="#18181b"/>
    <circle cx="369" cy="414" r="5" fill="#e53935"/>
    <circle cx="368" cy="413" r="2" fill="#ffffff" opacity="0.5"/>
  </g>


  <!-- ==================== 3D PIVOT SCREW / DIAL ==================== -->
  <g filter="url(#dropShadowTop)">
    <!-- Dial Base Depth -->
    <circle cx="400" cy="303" r="22" fill="url(#goldBottom)"/>
    <!-- Dial Top Surface -->
    <circle cx="398" cy="300" r="22" fill="url(#goldTop)"/>
    
    <!-- Dial Knurling (ridges) -->
    <circle cx="398" cy="300" r="21" fill="none" stroke="#8a6d1c" stroke-width="2" stroke-dasharray="2 3"/>

    <!-- Inner Recess -->
    <circle cx="398" cy="300" r="16" fill="#18181b" stroke="#3d2f07" stroke-width="1.5"/>
    <circle cx="398" cy="300" r="15" fill="none" stroke="#000000" stroke-width="2" opacity="0.8"/>

    <!-- Ruby Gem Base/Depth -->
    <circle cx="398" cy="302" r="12" fill="#4a0000"/>
    <!-- Ruby Gem Surface -->
    <circle cx="397" cy="299" r="12" fill="url(#ruby3D)"/>
    
    <!-- Ruby Sharp Highlight -->
    <ellipse cx="394" cy="294" rx="4" ry="2" fill="#ffffff" opacity="0.8" transform="rotate(-30 394 294)"/>
    <!-- Secondary internal reflection -->
    <path d="M 390,305 C 395,310 405,308 406,303" fill="none" stroke="#ff8a8a" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- ==================== LUXURY BADGE ==================== -->
  <g transform="translate(400, 540)" filter="url(#dropShadowTop)">
    <!-- Badge Depth -->
    <rect x="-88" y="-14" width="180" height="32" rx="16" fill="#000000"/>
    <!-- Badge Surface -->
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="url(#metalSurfaceTop)" stroke="#52525b" stroke-width="1"/>
    <!-- Inner Shadow/Bevel -->
    <rect x="-89" y="-15" width="178" height="30" rx="15" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    
    <!-- Embossed Text -->
    <text x="-1" y="3" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="4" text-anchor="middle" opacity="0.8">SALON SERVICE</text>
    <text x="-2" y="2" fill="#18181b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="4" text-anchor="middle">SALON SERVICE</text>
  </g>
</svg>
